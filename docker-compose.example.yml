services:
  giga-embeddings:
    build:
      context: .
      args:
        VLLM_IMAGE: vllm/vllm-openai:v0.10.2
    image: vllm-gigarembed:local
    ports:
      - "8090:8090"
    volumes:
      # Local snapshot of iMiW/Giga-Embeddings-instruct-4bit-nf4 (or full ai-sage model)
      - ${GIGA_MODEL_HOST_PATH}:/models/giga:ro
    environment:
      VLLM_PLUGINS: register_gigarembed
      GIGA_LOAD_IN_4BIT: "1"
      GIGA_HF_MAX_BATCH: "8"
    command:
      - --model
      - /models/giga
      - --host
      - "0.0.0.0"
      - --port
      - "8090"
      - --runner
      - pooling
      - --trust-remote-code
      - --served-model-name
      - Giga-Embeddings-instruct
      - --max-model-len
      - "4096"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "2gb"
    restart: unless-stopped
