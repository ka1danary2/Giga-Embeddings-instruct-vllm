services:
  giga-embeddings:
    build:
      context: .
      args:
        VLLM_IMAGE: vllm/vllm-openai:v0.10.2
    image: vllm-gigarembed:local
    ports:
      - "8090:8090"
    volumes:
      - ${GIGA_MODEL_HOST_PATH}:/models/giga:ro
    environment:
      VLLM_PLUGINS: register_gigarembed
      GIGA_LOAD_IN_4BIT: "1"
      GIGA_HF_MAX_BATCH: "8"
      VLLM_ENABLE_V1_MULTIPROCESSING: "0"
      VLLM_WORKER_MULTIPROC_METHOD: fork
    command:
      - --model
      - /models/giga
      - --host
      - "0.0.0.0"
      - --port
      - "8090"
      - --runner
      - pooling
      - --trust-remote-code
      - --served-model-name
      - Giga-Embeddings-instruct
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.4"
      - --enforce-eager
      - --load-format
      - dummy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "2gb"
    restart: unless-stopped
